name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest

  tts-player-ui:
    name: tts player ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build player bundle
        run: npm run build

      # The built HTML is what ships in the wheel, so it must match the source.
      - name: Check committed bundle is up to date
        run: |
          git diff --exit-code -- ../cartesia_mcp/static/tts-player.html || {
            echo "::error::Run 'npm run build' in ui/ and commit cartesia_mcp/static/tts-player.html"
            exit 1
          }

  stdio-smoke:
    name: stdio smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Build wheel
        run: uv build --wheel

      - name: Run built wheel over stdio
        working-directory: ${{ runner.temp }}
        run: |
          uv run --project "$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/scripts/stdio_smoke.py" \
            uvx --isolated --from "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" cartesia-mcp

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t cartesia-mcp:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name mcp-ci -p 8000:8000 \
            --add-host=host.docker.internal:host-gateway \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            cartesia-mcp:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs mcp-ci
          exit 1
