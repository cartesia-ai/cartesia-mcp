# Publishes to PyPI with Trusted Publishing (OIDC). Configure a trusted publisher
# for this workflow on PyPI (cartesia-ai/cartesia-mcp, publish-pypi.yml).
#
# Normally publish runs as a job in release-please.yml after a release is created.
# workflow_dispatch is kept for manual re-publishes if a prior run failed.
name: Publish PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      # PyPI Trusted Publishing (OIDC); no long-lived API token.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
