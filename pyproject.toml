[project]
name = "cartesia-mcp"
version = "0.33.0"
description = "The official Cartesia MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cartesia[websockets]>=4.2.0,<5",
    "httpx>=0.28.1",
    "mcp[cli]>=2,<3",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
cartesia-mcp = "cartesia_mcp.server:main"

[project.optional-dependencies]
hosted = [
    "ddtrace>=4.8.2,<5",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.0", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["cartesia_mcp"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.uv]
constraint-dependencies = ["python-multipart>=0.0.22"]

[tool.setuptools.package-data]
cartesia_mcp = ["static/*"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
