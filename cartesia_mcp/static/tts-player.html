<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartesia TTS</title>
    <style>
      :root {
        color-scheme: dark;
        --font:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-family: var(--font);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        background: #141514;
        color: #f4f4f5;
      }
      .card,
      .player-card {
        width: 100%;
        max-width: none;
        margin: 0;
        box-sizing: border-box;
        background: #141514;
        border: none;
        border-radius: 0;
        padding: 14px 0;
      }
      .top {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        padding: 0 16px;
      }
      .play {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: #2d3b2e;
        border: 1px solid #3f5240;
        color: #a7f3d0;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .play:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .play.is-playing {
        background: #c8efc2;
        border-color: #c8efc2;
        color: #142417;
      }
      .play:active:not(:disabled) {
        transform: scale(0.94);
      }
      .play svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .copy {
        min-width: 0;
      }
      .transcript {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .transcript.open {
        white-space: normal;
      }
      .sub {
        margin: 3px 0 0;
        font-size: 12px;
        line-height: 1.3;
        color: #8e928f;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icons {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .icon {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: #8e928f;
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        transition:
          color 0.12s ease,
          background 0.12s ease,
          transform 0.12s ease;
      }
      .icon:hover {
        color: #fff;
      }
      .icon:active {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        transform: scale(0.88);
      }
      .icon.flash {
        color: #86efac;
        background: rgba(34, 197, 94, 0.16);
      }
      .icon svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .wave-block {
        margin: 12px 0 0;
        padding: 0;
        width: 100%;
      }
      .wave {
        position: relative;
        width: 100%;
        height: 36px;
        margin: 0;
        padding: 0;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 24px,
          black calc(100% - 24px),
          transparent 100%
        );
        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 24px,
          black calc(100% - 24px),
          transparent 100%
        );
      }
      .bars {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        width: 100%;
        height: 32px;
        margin: 0;
        padding: 0;
      }
      .bar {
        flex: 0 0 auto;
        min-width: 0;
        border-radius: 999px;
        background: #404240;
        pointer-events: none;
      }
      .bar.played {
        background: linear-gradient(to top, #16a34a, #22c55e);
      }
      .playhead {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 36px;
        background: #86efac;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        border-radius: 999px;
        pointer-events: none;
        transform: translateX(0);
      }
      .times {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 4px;
        padding: 0 16px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #8e928f;
      }
    </style>
  </head>
  <body>
    <div class="card player-card">
      <div class="top">
        <button type="button" class="play" id="playBtn" disabled aria-label="Play">
          <svg id="playGlyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9 6.5v11l9-5.5-9-5.5z" />
          </svg>
        </button>
        <div class="copy">
          <p class="transcript" id="transcript" title="">Waiting for generation…</p>
          <p class="sub" id="sub">—</p>
        </div>
        <div class="icons">
          <button type="button" class="icon" id="copyCurl" title="Copy curl" aria-label="Copy curl">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 9l-3 3 3 3" />
              <path d="M16 9l3 3-3 3" />
              <path d="M13 7l-2 10" />
            </svg>
          </button>
          <button type="button" class="icon" id="downloadBtn" title="Download audio" aria-label="Download audio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 4v10" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 19h14" />
            </svg>
          </button>
        </div>
      </div>

      <div class="wave-block">
        <div
          class="wave"
          id="wave"
          role="slider"
          tabindex="0"
          aria-label="Seek"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="bars" id="bars"></div>
          <div class="playhead" id="playhead"></div>
        </div>
        <div class="times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>
    </div>

    <script type="module">
      import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@2.0.4/dist/src/app-with-deps.js";

      const BAR_COUNT = 110;
      const PLAY_PATH = "M9 6.5v11l9-5.5-9-5.5z";
      const PAUSE_PATH = "M7 5.5h3.2v13H7v-13zm6.8 0H17v13h-3.2v-13z";

      const els = {
        playBtn: document.getElementById("playBtn"),
        playGlyph: document.getElementById("playGlyph"),
        transcript: document.getElementById("transcript"),
        sub: document.getElementById("sub"),
        wave: document.getElementById("wave"),
        bars: document.getElementById("bars"),
        playhead: document.getElementById("playhead"),
        timeCurrent: document.getElementById("timeCurrent"),
        timeTotal: document.getElementById("timeTotal"),
        copyCurl: document.getElementById("copyCurl"),
        downloadBtn: document.getElementById("downloadBtn"),
      };

      /** @type {Record<string, any>} */
      let current = {};
      const audio = new Audio();
      audio.preload = "auto";
      /** @type {number[]} */
      let peaks = Array.from({ length: BAR_COUNT }, () => 0.18);
      let duration = 0;
      let progress = 0;
      let raf = 0;
      let scrubbing = false;
      let laidOutWidth = 0;
      const BAR_GAP = 2;

      function formatTime(sec) {
        if (!Number.isFinite(sec) || sec < 0) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function sampleRateLabel() {
        const rate = Number(current.output_format?.sample_rate || 44100);
        return `${(rate / 1000).toFixed(1)} kHz`;
      }

      function setGlyph(playing) {
        els.playGlyph.querySelector("path").setAttribute("d", playing ? PAUSE_PATH : PLAY_PATH);
        els.playBtn.classList.toggle("is-playing", playing);
        els.playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
      }

      function layoutBars() {
        const width = els.wave.clientWidth || 0;
        if (!width || width === laidOutWidth || !els.bars.children.length) return;
        laidOutWidth = width;
        const barWidth = Math.max(1, (width - BAR_GAP * (BAR_COUNT - 1)) / BAR_COUNT);
        const nodes = els.bars.children;
        for (let i = 0; i < nodes.length; i++) {
          nodes[i].style.width = `${barWidth}px`;
          nodes[i].style.marginRight = i === nodes.length - 1 ? "0" : `${BAR_GAP}px`;
        }
      }

      function paint(p) {
        progress = Math.min(1, Math.max(0, p || 0));
        const nodes = els.bars.children;
        for (let i = 0; i < nodes.length; i++) {
          const t = (i + 0.5) / BAR_COUNT;
          nodes[i].classList.toggle("played", t <= progress);
        }
        layoutBars();
        const width = els.wave.clientWidth || 0;
        const x = progress * Math.max(0, width - 2);
        els.playhead.style.transform = `translateX(${x}px)`;
        els.timeCurrent.textContent = formatTime(duration * progress);
        els.timeTotal.textContent = formatTime(duration);
        els.wave.setAttribute("aria-valuenow", String(Math.round(progress * 100)));
      }

      function renderBars() {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < BAR_COUNT; i++) {
          const bar = document.createElement("div");
          bar.className = "bar";
          bar.style.height = `${3 + peaks[i] * 25}px`;
          frag.appendChild(bar);
        }
        els.bars.replaceChildren(frag);
        laidOutWidth = 0;
        paint(progress);
      }

      function stopRaf() {
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
      }

      function tick() {
        if (!scrubbing && duration > 0 && !audio.paused) {
          paint(audio.currentTime / duration);
        }
        raf = !audio.paused ? requestAnimationFrame(tick) : 0;
      }

      function startRaf() {
        stopRaf();
        raf = requestAnimationFrame(tick);
      }

      async function buildPeaks(url) {
        try {
          const res = await fetch(url);
          const buf = await res.arrayBuffer();
          const ctx = new AudioContext();
          const decoded = await ctx.decodeAudioData(buf.slice(0));
          const channel = decoded.getChannelData(0);
          const block = Math.max(1, Math.floor(channel.length / BAR_COUNT));
          const next = [];
          for (let i = 0; i < BAR_COUNT; i++) {
            let peak = 0;
            const start = i * block;
            const end = Math.min(channel.length, start + block);
            for (let j = start; j < end; j++) peak = Math.max(peak, Math.abs(channel[j]));
            next.push(peak);
          }
          const max = Math.max(...next, 0.001);
          peaks = next.map((v) => v / max);
          if (Number.isFinite(decoded.duration) && decoded.duration > 0) duration = decoded.duration;
          await ctx.close();
        } catch {
          peaks = Array.from({ length: BAR_COUNT }, (_, i) => 0.15 + 0.55 * Math.abs(Math.sin(i * 0.21)));
        }
        progress = 0;
        renderBars();
      }

      function seekFromClientX(clientX) {
        const rect = els.wave.getBoundingClientRect();
        if (!rect.width || !duration) return;
        const x = Math.min(Math.max(0, clientX - rect.left), rect.width);
        const p = x / rect.width;
        audio.currentTime = p * duration;
        paint(p);
      }

      function shellQuote(value) {
        return `'${String(value).replaceAll("'", `'\\''`)}'`;
      }

      function curlSnippet() {
        const model = current.model_id || "sonic-3";
        const fmt = current.output_format || {
          container: "wav",
          encoding: "pcm_s16le",
          sample_rate: 44100,
        };
        const output_format = {
          container: fmt.container || "wav",
          sample_rate: fmt.sample_rate || 44100,
        };
        if (fmt.encoding) output_format.encoding = fmt.encoding;
        if (fmt.bit_rate) output_format.bit_rate = fmt.bit_rate;
        const body = {
          model_id: model,
          transcript: current.transcript || "",
          voice: current.voice_id,
          output_format,
        };
        const generation_config = {};
        if (current.speed != null) generation_config.speed = current.speed;
        if (current.volume != null) generation_config.volume = current.volume;
        if (Object.keys(generation_config).length) body.generation_config = generation_config;
        const ext = String(output_format.container || "wav").replace(/[^a-z0-9]/gi, "") || "wav";
        const slug = String(current.file_id || "clip")
          .replace(/^file_/, "")
          .slice(-6)
          .toLowerCase();
        const outfile = `cartesia-${model}-${slug}.${ext}`;
        return [
          "curl -s -X POST https://api.cartesia.ai/tts/bytes \\",
          '-H "Cartesia-Version: 2026-08-14" \\',
          '-H "X-API-Key: $CARTESIA_API_KEY" \\',
          '-H "Content-Type: application/json" \\',
          `-d ${shellQuote(JSON.stringify(body))} \\`,
          `-o ${outfile}`,
        ].join("\n");
      }

      function flash(button) {
        button.classList.add("flash");
        window.setTimeout(() => button.classList.remove("flash"), 450);
      }

      async function resolveVoiceName(voiceId) {
        if (!voiceId) return;
        try {
          const result = await app.callServerTool({
            name: "get_voice",
            arguments: { voice_id: voiceId },
          });
          const structured = result?.structuredContent;
          let voice = structured?.voice ?? structured;
          if (!voice?.name) {
            const text = result?.content?.find?.((c) => c.type === "text")?.text;
            if (typeof text === "string") {
              try {
                voice = JSON.parse(text);
              } catch {
                voice = null;
              }
            }
          }
          if (typeof voice?.name === "string" && voice.name.trim()) {
            current.voice_name = voice.name.trim().split("\n")[0].slice(0, 48);
            current.voice_tagline =
              typeof voice.tagline === "string" ? voice.tagline.trim().slice(0, 48) : "";
            current.voice_featured = voice.is_featured === true;
            renderSub();
          }
        } catch {
          /* keep fallback */
        }
      }

      function renderSub() {
        const parts = [current.voice_name || "Voice"];
        if (current.voice_tagline) parts.push(current.voice_tagline);
        parts.push(sampleRateLabel());
        let line = parts.join(" - ");
        if (current.voice_featured) line += " [Featured]";
        els.sub.textContent = line;
      }

      function applyPayload(payload) {
        if (!payload || typeof payload !== "object") return;
        stopRaf();
        audio.pause();
        setGlyph(false);
        current = { ...payload };
        const transcript = payload.transcript || payload.text || "";
        els.transcript.textContent = transcript || "(no transcript)";
        els.transcript.title = transcript;
        els.transcript.classList.remove("open");
        current.voice_name = payload.voice_name || "Voice";
        renderSub();
        if (payload.voice_id) resolveVoiceName(payload.voice_id);

        duration = 0;
        progress = 0;
        peaks = Array.from({ length: BAR_COUNT }, () => 0.18);
        renderBars();

        const url = payload.download_url;
        if (typeof url === "string" && url.startsWith("https://")) {
          audio.src = url;
          els.playBtn.disabled = false;
          buildPeaks(url);
        } else {
          audio.removeAttribute("src");
          els.playBtn.disabled = true;
        }
      }

      function extractPayload(params) {
        if (params?.structuredContent && typeof params.structuredContent === "object") {
          return params.structuredContent;
        }
        const text = params?.content?.find?.((c) => c.type === "text")?.text;
        if (!text) return null;
        try {
          return JSON.parse(text);
        } catch {
          return { transcript: text };
        }
      }

      els.playBtn.addEventListener("click", async () => {
        if (!audio.src) return;
        if (audio.paused) {
          try {
            await audio.play();
          } catch {
            /* gesture */
          }
        } else audio.pause();
      });

      audio.addEventListener("play", () => {
        setGlyph(true);
        startRaf();
      });
      audio.addEventListener("pause", () => {
        setGlyph(false);
        stopRaf();
        if (duration > 0) paint(audio.currentTime / duration);
      });
      audio.addEventListener("ended", () => {
        setGlyph(false);
        stopRaf();
        paint(1);
      });
      audio.addEventListener("loadedmetadata", () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          duration = audio.duration;
          paint(audio.currentTime / duration || 0);
        }
      });

      els.wave.addEventListener("pointerdown", (e) => {
        scrubbing = true;
        els.wave.setPointerCapture(e.pointerId);
        seekFromClientX(e.clientX);
      });
      els.wave.addEventListener("pointermove", (e) => {
        if (!scrubbing) return;
        seekFromClientX(e.clientX);
      });
      function endScrub(e) {
        if (!scrubbing) return;
        seekFromClientX(e.clientX);
        scrubbing = false;
        try {
          els.wave.releasePointerCapture(e.pointerId);
        } catch {
          /* released */
        }
      }
      els.wave.addEventListener("pointerup", endScrub);
      els.wave.addEventListener("pointercancel", () => {
        scrubbing = false;
      });

      els.transcript.addEventListener("click", () => {
        els.transcript.classList.toggle("open");
      });

      els.copyCurl.addEventListener("click", async () => {
        flash(els.copyCurl);
        try {
          await navigator.clipboard.writeText(curlSnippet());
        } catch {
          /* clipboard */
        }
      });

      els.downloadBtn.addEventListener("click", async () => {
        flash(els.downloadBtn);
        const url = current.download_url;
        if (typeof url !== "string") return;
        const ext = String(current.output_format?.container || "mp3").replace(/[^a-z0-9]/gi, "") || "mp3";
        try {
          const res = await fetch(url);
          const blob = await res.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `cartesia-tts.${ext}`;
          a.click();
          URL.revokeObjectURL(a.href);
        } catch {
          window.open(url, "_blank", "noopener,noreferrer");
        }
      });

      renderBars();
      new ResizeObserver(() => {
        laidOutWidth = 0;
        paint(progress);
      }).observe(els.wave);

      const app = new App({ name: "Cartesia TTS Player", version: "0.5.0" });
      app.ontoolresult = (params) => {
        if (params?.isError) return;
        applyPayload(extractPayload(params));
      };
      await app.connect();
    </script>
  </body>
</html>
