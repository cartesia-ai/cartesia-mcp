<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartesia TTS</title>
    <style>
      :root {
        color-scheme: dark;
        --font:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-family: var(--font);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        background: #141514;
        color: #f4f4f5;
      }
      .player-card {
        width: 100%;
        max-width: none;
        margin: 0;
        box-sizing: border-box;
        background: #141514;
        border: none;
        border-radius: 0;
        padding: 14px 0;
      }
      .top {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        padding: 0 16px;
      }
      .play {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: #2d3b2e;
        border: 1px solid #3f5240;
        color: #a7f3d0;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .play:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .play.is-playing {
        background: #c8efc2;
        border-color: #c8efc2;
        color: #142417;
      }
      .play:active:not(:disabled) {
        transform: scale(0.94);
      }
      .play svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .copy {
        min-width: 0;
      }
      .transcript {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .transcript.open {
        white-space: normal;
      }
      .sub {
        margin: 3px 0 0;
        font-size: 12px;
        line-height: 1.3;
        color: #8e928f;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icons {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .icon {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: #8e928f;
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        transition:
          color 0.12s ease,
          background 0.12s ease,
          transform 0.12s ease;
      }
      .icon:hover {
        color: #fff;
      }
      .icon:active {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        transform: scale(0.88);
      }
      .icon.flash {
        color: #86efac;
        background: rgba(34, 197, 94, 0.16);
      }
      .icon.flash-error {
        color: #fca5a5;
        background: rgba(248, 113, 113, 0.16);
      }
      .icon svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .wave-block {
        margin: 12px 0 0;
        padding: 0;
        width: 100%;
      }
      .wave {
        position: relative;
        width: 100%;
        height: 36px;
        margin: 0;
        padding: 0;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 24px,
          black calc(100% - 24px),
          transparent 100%
        );
        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 24px,
          black calc(100% - 24px),
          transparent 100%
        );
      }
      .bars {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        width: 100%;
        height: 32px;
        margin: 0;
        padding: 0;
      }
      .bar {
        flex: 0 0 auto;
        min-width: 0;
        border-radius: 999px;
        background: #404240;
        pointer-events: none;
      }
      .bar.played {
        background: linear-gradient(to top, #16a34a, #22c55e);
      }
      .playhead {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 36px;
        background: #86efac;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        border-radius: 999px;
        pointer-events: none;
        transform: translateX(0);
      }
      .times {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 4px;
        padding: 0 16px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #8e928f;
      }
      .note {
        margin: 10px 0 0;
        padding: 0 16px;
        font-size: 12px;
        line-height: 1.4;
        color: #8e928f;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="player-card">
      <div class="top">
        <button type="button" class="play" id="playBtn" disabled aria-label="Play">
          <svg id="playGlyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9 6.5v11l9-5.5-9-5.5z" />
          </svg>
        </button>
        <div class="copy">
          <p class="transcript" id="transcript" title="">Waiting for generation…</p>
          <p class="sub" id="sub">—</p>
        </div>
        <div class="icons">
          <button type="button" class="icon" id="copyCurl" title="Copy curl" aria-label="Copy curl" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 9l-3 3 3 3" />
              <path d="M16 9l3 3-3 3" />
              <path d="M13 7l-2 10" />
            </svg>
          </button>
          <button type="button" class="icon" id="downloadBtn" title="Download audio" aria-label="Download audio" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 4v10" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 19h14" />
            </svg>
          </button>
        </div>
      </div>

      <div class="wave-block" id="waveBlock">
        <div
          class="wave"
          id="wave"
          role="slider"
          tabindex="0"
          aria-label="Seek"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="bars" id="bars"></div>
          <div class="playhead" id="playhead"></div>
        </div>
        <div class="times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>
      <p class="note" id="note" hidden></p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
